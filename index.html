<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SuscriOFF te recuerda cuándo termina la prueba gratuita de una suscripción y te deja el enlace de cancelación a mano.">
  <title>SuscriOFF — Controla tus pruebas gratuitas</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-frame">

    <!-- Pantalla 1: Inicio -->
    <section id="screen-inicio" class="screen screen--inicio" aria-labelledby="titulo-inicio">
      <header class="screen-header">
        <span class="screen-number" aria-hidden="true">1</span>
        <h1 class="screen-title" id="titulo-inicio">SuscriOFF</h1>
        <button id="btn-agregar" class="header-add" type="button" aria-label="Agregar nueva prueba">+</button>
      </header>

      <div class="screen-body">
        <div class="summary-card" aria-live="polite">
          <p class="summary-card__label">Gasto mensual en riesgo</p>
          <p class="summary-card__amount" id="gasto-total">$ 0 COP</p>
          <p class="summary-card__count" id="gasto-count">0 pruebas gratuitas activas</p>
        </div>

        <h2 class="section-title">Próximos vencimientos</h2>
        <ul id="lista-pruebas" class="trial-list" aria-label="Próximos vencimientos"></ul>
      </div>

      <nav class="bottom-nav" aria-label="Navegación principal">
        <button class="nav-item is-active" type="button" data-destino="inicio">Inicio</button>
        <button class="nav-item" type="button" data-destino="nueva">Agregar</button>
        <button class="nav-item" type="button" data-destino="calendario">Calendario</button>
      </nav>
    </section>

    <!-- Pantalla 2: Nueva prueba gratuita -->
    <section id="screen-nueva" class="screen" aria-labelledby="titulo-nueva" hidden></section>

    <!-- Pantalla 3: Detalle -->
    <section id="screen-detalle" class="screen" aria-labelledby="titulo-detalle" hidden></section>

    <!-- Pantalla 4: Recordatorio creado -->
    <section id="screen-confirmacion" class="screen" aria-labelledby="titulo-confirmacion" hidden></section>

    <!-- Calendario: lista sencilla de avisos creados -->
    <section id="screen-calendario" class="screen" aria-labelledby="titulo-calendario" hidden>
      <header class="screen-header">
        <span class="screen-number" aria-hidden="true">C</span>
        <h1 class="screen-title" id="titulo-calendario">Calendario</h1>
      </header>
      <div class="screen-body">
        <h2 class="section-title">Avisos creados</h2>
        <ul id="lista-avisos" class="notice-list"></ul>
      </div>
      <div class="screen-footer">
        <button class="button button--secondary button--wide" type="button" data-destino="inicio">Volver al inicio</button>
      </div>
    </section>

  </div>
</body>
</html>
